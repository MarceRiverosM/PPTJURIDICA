<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Gestión y Red Financiera - Davivienda</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes slideRight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
        .selection\:bg-red-100 *::selection { background-color: #fee2e2; color: #E01E26; }
        
        /* Ajustes específicos para Guardar como PDF o Imprimir */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .print-avoid-break {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body class="text-gray-800 bg-[#F9FAFB] min-h-screen selection:bg-red-100 selection:text-[#E01E26]">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- SVGs Icons Components ---
        const IconMenu = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>;
        const IconX = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
        const IconBuilding = () => <svg className="w-12 h-12 lg:w-16 lg:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>;
        const IconUsers = () => <svg className="w-12 h-12 lg:w-16 lg:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconKey = () => <svg className="w-12 h-12 lg:w-16 lg:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>;
        const IconShield = () => <svg className="w-12 h-12 lg:w-16 lg:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>;
        const IconTrending = () => <svg className="w-12 h-12 lg:w-16 lg:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>;
        const IconCog = () => <svg className="w-12 h-12 lg:w-16 lg:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>;

        // --- COMPONENTE: Fondo Global Difuminado ---
        const BackgroundWatermark = () => (
          <div className="fixed inset-0 z-[-1] pointer-events-none overflow-hidden bg-[#F9FAFB] print:hidden">
            <div className="absolute top-[-20%] right-[-10%] w-[80vw] h-[80vw] rounded-[100%] border-[1px] border-[#E01E26]/20 shadow-[0_0_80px_rgba(224,30,38,0.03)] transform rotate-12"></div>
            <div className="absolute top-[-10%] right-[-20%] w-[90vw] h-[90vw] rounded-[100%] border-[3px] border-[#E01E26]/10 shadow-[inset_0_0_100px_rgba(224,30,38,0.04)] transform rotate-45"></div>
            <div className="absolute bottom-[-30%] left-[-10%] w-[70vw] h-[70vw] rounded-[100%] border-[2px] border-gray-200 shadow-[0_0_120px_rgba(0,0,0,0.02)]"></div>

            <div className="absolute inset-0 flex items-center justify-center opacity-10 mix-blend-multiply">
                <img 
                  src="fondo_agua.png" 
                  alt="Marca de agua Davivienda" 
                  className="w-[70vw] max-w-[800px] object-contain"
                  onError={(e) => { 
                      e.target.style.display = 'none'; 
                      document.getElementById('fallback-logo').style.display = 'block';
                  }}
                />
                <div id="fallback-logo" className="hidden text-gray-800">
                   <svg className="w-[50vw] max-w-[500px] h-auto" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                   </svg>
                </div>
            </div>
          </div>
        );

        // --- Navigation Menu Component ---
        const Navbar = ({ toggleMenu, isMenuOpen }) => (
          <nav className="fixed print:absolute print:shadow-none w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm print:bg-white">
            <div className="max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-24 lg:h-28">
                
                {/* Logo representation */}
                <div className="flex-shrink-0 flex items-center gap-3">
                  <img 
                    src="titulo_final.png" 
                    alt="Davivienda" 
                    className="h-12 md:h-14 lg:h-16 w-auto object-contain" 
                    onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/200x60/FFFFFF/E01E26?text=Davivienda'; }} 
                  />
                </div>
                
                {/* Menú Desktop */}
                <div className="hidden lg:flex items-center space-x-8 xl:space-x-12 print:hidden">
                    <a href="#relacion-vinculados" className="text-base lg:text-lg xl:text-xl font-semibold text-gray-600 hover:text-[#E01E26] transition-colors">Vinculados</a>
                    <a href="#economias-escala" className="text-base lg:text-lg xl:text-xl font-semibold text-gray-600 hover:text-[#E01E26] transition-colors">Economías de Escala</a>
                    <a href="#uso-red" className="text-base lg:text-lg xl:text-xl font-semibold text-gray-600 hover:text-[#E01E26] transition-colors">Uso de Red</a>
                    <a href="#sinergia-estrategica" className="text-base lg:text-lg xl:text-xl font-semibold text-gray-600 hover:text-[#E01E26] transition-colors">Sinergia</a>
                    <a href="#retos-transformacion" className="text-base lg:text-lg xl:text-xl font-semibold text-gray-600 hover:text-[#E01E26] transition-colors">Retos</a>
                </div>

                <div className="flex lg:hidden items-center">
                  <button onClick={toggleMenu} className="text-[#1F2937] hover:text-[#E01E26] focus:outline-none transition-colors print:hidden">
                    {isMenuOpen ? <IconX /> : <IconMenu />}
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Menu Overlay */}
            {isMenuOpen && (
              <div className="absolute top-24 left-0 w-full h-screen bg-white shadow-2xl animate-fade-in flex flex-col pt-8 px-8 gap-8 text-2xl font-semibold text-gray-700 print:hidden lg:hidden">
                <a href="#relacion-vinculados" onClick={toggleMenu} className="hover:text-[#E01E26] border-b border-gray-100 pb-4 transition-colors">1. Relación entre Vinculados</a>
                <a href="#economias-escala" onClick={toggleMenu} className="hover:text-[#E01E26] border-b border-gray-100 pb-4 transition-colors">2. Economías de Escala</a>
                <a href="#uso-red" onClick={toggleMenu} className="hover:text-[#E01E26] border-b border-gray-100 pb-4 transition-colors">3. Contrato de Uso de Red</a>
                <a href="#sinergia-estrategica" onClick={toggleMenu} className="hover:text-[#E01E26] border-b border-gray-100 pb-4 transition-colors">4. Sinergia Estratégica</a>
                <a href="#retos-transformacion" onClick={toggleMenu} className="hover:text-[#E01E26] pb-4 transition-colors">5. Retos de la Transformación</a>
              </div>
            )}
          </nav>
        );

        // --- Sections Components ---
        const Hero = () => (
          <section className="relative pt-40 pb-32 lg:pt-56 lg:pb-48 overflow-hidden bg-white text-[#1F2937] bg-transparent">
            <div className="absolute top-0 right-0 -mr-20 -mt-20 w-[800px] h-[800px] bg-[#E01E26] opacity-5 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-[600px] h-[600px] bg-[#E01E26] opacity-5 rounded-full blur-2xl pointer-events-none"></div>
            
            <div className="relative max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8 text-center z-10 print-avoid-break">
              <h1 className="text-6xl md:text-8xl lg:text-9xl font-extrabold tracking-tight mb-8 text-[#1F2937]">
                Proyecto Somos <span className="text-[#E01E26]">Uno</span>
              </h1>
              <p className="mt-8 text-2xl md:text-3xl lg:text-4xl text-gray-600 max-w-5xl lg:max-w-6xl mx-auto font-light leading-relaxed">
                Una visión integral desde el Contrato de Uso de Red hasta la optimización transversal para brindar la mejor experiencia a nuestros clientes.
              </p>
              <div className="mt-16 print:hidden">
                <a href="#relacion-vinculados" className="inline-block bg-[#E01E26] text-white font-bold text-xl lg:text-2xl py-6 px-14 rounded-full hover:bg-red-700 transition shadow-[0_8px_20px_rgba(224,30,38,0.3)] hover:shadow-[0_12px_25px_rgba(224,30,38,0.4)] transform hover:-translate-y-1">
                  Explorar el Modelo
                </a>
              </div>
            </div>
          </section>
        );

        // --- PUNTO 1 REALIZADO: Reubicado Economías de Escala inmediatamente después de los cuadros de Vinculados ---
        const EconomiasEscala = () => {
          const [activeReq, setActiveReq] = useState(null);

          const requisitos = [
            { id: 1, title: "1. Límites en Actividades", desc: "No se podrán compartir actividades propias del core del negocio, evitando así la \"delegación de profesionalidad\"." },
            { id: 2, title: "2. Retención de Responsabilidad", desc: "La entidad mantiene su responsabilidad legal; únicamente entrega la ejecución de la labor sin trasladar el deber misional." },
            { id: 3, title: "3. Políticas de Remuneración", desc: "No es admisible bajo ninguna circunstancia que una entidad subsidie los costos de operación de otra del mismo grupo." },
            { id: 4, title: "4. Aprobación de la Junta", desc: "El contrato debe constar por escrito y ser aprobado, monitoreado y mejorado directamente por la Junta Directiva. Sin perjuicio de las reglas adicionales que existen como conflictos de interés, criterios de materialidad y demás." },
            { id: 5, title: "5. Gestión de Riesgos", desc: "Se exige un estricto sistema de control, análisis del impacto en el perfil de riesgos intragrupo y planes de contingencia." },
            { id: 6, title: "6. Resolución de Controversias", desc: "Deben establecerse líneas claras para identificar fácilmente a la entidad responsable ante cualquier eventualidad." },
            { id: 7, title: "7. Confidencialidad Absoluta", desc: "Es mandatorio adoptar medidas estrictas para garantizar la protección de la información de la entidad y, fundamentalmente, la de todos sus clientes." }
          ];
  const EconomiasEscala = () => {
          const [activeReq, setActiveReq] = useState(null);

          const requisitos = [
            { id: 1, title: "1. Límites en Actividades", desc: "No se podrán compartir actividades propias del core del negocio, evitando así la \"delegación de profesionalidad\"." },
            { id: 2, title: "2. Retención de Responsabilidad", desc: "La entidad mantiene su responsabilidad legal; únicamente entrega la ejecución de la labor sin trasladar el deber misional." },
            { id: 3, title: "3. Políticas de Remuneración", desc: "No es admisible bajo ninguna circunstancia que una entidad subsidie los costos de operación de otra del mismo grupo." },
            { id: 4, title: "4. Aprobación de la Junta", desc: "El contrato debe constar por escrito y ser aprobado, monitoreado y mejorado directamente por la Junta Directiva. Sin perjuicio de las reglas adicionales que existen como conflictos de interés, criterios de materialidad y demás." },
            { id: 5, title: "5. Gestión de Riesgos", desc: "Se exige un estricto sistema de control, análisis del impacto en el perfil de riesgos intragrupo y planes de contingencia." },
            { id: 6, title: "6. Resolución de Controversias", desc: "Deben establecerse líneas claras para identificar fácilmente a la entidad responsable ante cualquier eventualidad." },
            { id: 7, title: "7. Confidencialidad Absoluta", desc: "Es mandatorio adoptar medidas estrictas para garantizar la protección de la información de la entidad y, fundamentalmente, la de todos sus clientes." }
          ];

          return (
            <section id="economias-escala" className="py-32 bg-white/40 backdrop-blur-sm border-t border-red-50 relative overflow-hidden">
              <div className="max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                
                <div className="text-center mb-20 print-avoid-break">
                  <h2 className="text-4xl md:text-6xl lg:text-7xl font-extrabold text-[#1F2937] mb-6">Economías de Escala</h2>
                  <p className="text-2xl lg:text-3xl text-gray-600 max-w-5xl mx-auto leading-relaxed">Sinergia y Especialización: Transformación de fuerzas en Corredores y acuerdos de colaboración con la Fiduciaria para optimizar la atención.</p>
                </div>

                <div className="mb-32 print-avoid-break">
                  <div className="bg-white border border-gray-100 rounded-[2rem] p-10 md:p-16 lg:p-20 shadow-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-3 h-full bg-[#E01E26]"></div>
                    
                    <div className="mb-16 flex justify-center w-full">
                      <video 
                        className="w-full max-w-6xl h-auto rounded-3xl shadow-sm border border-gray-100 object-cover"
                        controls
                        preload="metadata"
                        poster="https://via.placeholder.com/1200x600/F9FAFB/1F2937?text=Video+Economías+de+Escala+(Haz+clic+para+reproducir)"
                      >
                        <source src="video_economias_escala.mp4" type="video/mp4" />
                        Tu navegador no soporta la reproducción de videos.
                      </video>
                    </div>

                    <div>
                      <h4 className="text-lg lg:text-xl font-bold text-[#E01E26] mb-8 uppercase tracking-widest text-center md:text-left">Requisitos y Condiciones </h4>
                      
                      {activeReq === null ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {requisitos.map((req) => (
                            <button 
                              key={req.id} 
                              onClick={() => setActiveReq(req)}
                              className="bg-gray-50 p-6 lg:p-8 rounded-2xl border border-gray-200 hover:border-[#E01E26] hover:shadow-md transition-all duration-300 text-left flex items-center gap-4 group cursor-pointer"
                            >
                              <span className="text-[#E01E26] text-3xl font-bold group-hover:scale-125 transition-transform duration-300">•</span>
                              <h5 className="font-bold text-[#1F2937] text-xl">{req.title}</h5>
                            </button>
                          ))}
                        </div>
                      ) : (
                        <div className="bg-gray-50 p-8 lg:p-12 rounded-3xl border border-gray-200 shadow-inner animate-fade-in relative print-avoid-break">
                          <button 
                            onClick={() => setActiveReq(null)}
                            className="absolute top-6 right-6 lg:top-8 lg:right-8 text-gray-400 hover:text-[#E01E26] transition-colors focus:outline-none print:hidden"
                            title="Cerrar"
                          >
                            <svg className="w-8 h-8 lg:w-10 lg:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                          </button>
                          
                          <div className="flex items-center justify-center gap-4 mb-6 lg:mb-8 border-b border-gray-200 pb-6 px-4 md:px-12 text-center">
                            <span className="text-[#E01E26] text-4xl lg:text-5xl font-bold">•</span>
                            <h5 className="font-extrabold text-[#1F2937] text-3xl lg:text-4xl leading-tight">{activeReq.title}</h5>
                          </div>
                          
                          <p className="text-gray-700 text-2xl lg:text-3xl leading-relaxed max-w-5xl mx-auto text-center">
                            {activeReq.desc}
                          </p>
                          
                          <div className="mt-10 lg:mt-12 text-center print:hidden">
                            <button 
                              onClick={() => setActiveReq(null)}
                              className="inline-flex items-center justify-center bg-white border-2 border-gray-300 text-gray-600 font-bold text-lg py-4 px-8 rounded-full hover:border-[#E01E26] hover:text-[#E01E26] hover:bg-red-50 transition shadow-sm transform hover:-translate-y-1"
                            >
                              &larr; Volver al listado
                            </button>
                          </div>
                        </div>
                      )}

                    </div>
                  </div>
                </div>
          
     
        const UsoDeRed = () => (
          <section id="uso-red" className="py-32 bg-transparent">
            <div className="max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-20 print-avoid-break">
                <span className="text-[#E01E26] font-bold uppercase tracking-wider text-base lg:text-lg bg-red-50/80 backdrop-blur-sm px-6 py-2 rounded-full inline-block mb-6">Dec. 2555 de 2010 (Art. 2.34.1.1.1)</span>
                <h2 className="text-4xl md:text-6xl lg:text-7xl font-extrabold text-[#1F2937] mb-8">¿Qué es el Contrato de Uso de Red?</h2>
                
                <div className="max-w-6xl mx-auto bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden group hover:shadow-xl transition-all duration-500 cursor-default print-avoid-break mt-12">
                  <div className="p-8 md:p-14 lg:p-20 flex flex-col md:flex-row items-center justify-between gap-10 relative">
                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-red-50/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    
                    <div className="relative z-10 flex flex-col items-center text-center transform group-hover:scale-105 transition duration-300">
                      <div className="w-24 h-24 lg:w-32 lg:h-32 bg-[#1F2937] rounded-3xl flex items-center justify-center text-white mb-6 shadow-md">
                        <IconBuilding />
                      </div>
                      <span className="font-bold text-[#1F2937] text-2xl lg:text-3xl mb-2">Entidad Prestataria</span>
                      <span className="text-sm lg:text-base text-gray-500 uppercase font-bold tracking-widest">"La Red"</span>
                    </div>

                    <div className="relative z-10 flex-1 flex flex-col items-center justify-center min-w-[300px] w-full py-8 md:py-0">
                      <div className="text-[#E01E26] font-bold text-lg lg:text-xl mb-6 flex items-center gap-3">
                        <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-100 text-2xl">💰</span>
                        Acuerdo
                      </div>
                      
                      <div className="w-full flex items-center justify-center relative h-10">
                        <div className="absolute inset-0 flex items-center justify-between px-4 opacity-30">
                            {[...Array(12)].map((_, i) => <div key={i} className="w-2 h-2 rounded-full bg-gray-300"></div>)}
                        </div>
                        <div className="h-2 w-full bg-gray-100 rounded-full overflow-hidden relative">
                          <div className="absolute top-0 bottom-0 left-0 w-1/3 bg-gradient-to-r from-transparent via-[#E01E26] to-transparent animate-[slideRight_2s_linear_infinite] group-hover:animate-[slideRight_1s_linear_infinite]"></div>
                        </div>
                      </div>
                      
                      <div className="text-gray-500 text-sm lg:text-base mt-6 uppercase tracking-widest font-semibold flex items-center gap-3">
                        Infraestructura Compartida
                        <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-100 text-2xl">🚀</span>
                      </div>
                    </div>

                    <div className="relative z-10 flex flex-col items-center text-center transform group-hover:scale-105 transition duration-300">
                      <div className="w-24 h-24 lg:w-32 lg:h-32 bg-white border-[6px] border-[#E01E26] rounded-3xl flex items-center justify-center text-[#E01E26] mb-6 shadow-md">
                        <IconUsers />
                      </div>
                      <span className="font-bold text-[#1F2937] text-2xl lg:text-3xl mb-2">Entidad Usuaria</span>
                      <span className="text-sm lg:text-base text-[#E01E26] uppercase font-bold tracking-widest">Ofrece Productos</span>
                    </div>
                  </div>
                  
                  <div className="bg-gray-50 p-10 lg:p-14 text-center border-t border-gray-100 relative z-10">
                    <p className="text-xl md:text-2xl lg:text-3xl text-gray-700 leading-relaxed max-w-5xl mx-auto">
                      Un <strong className="text-[#1F2937]">contrato </strong> entre dos entidades financieras donde una ("La Prestataria") permite que otra ("La Usuaria") <strong className="text-[#E01E26]">ofrezca sus productos o servicios </strong> a través de su red de distribución e infraestructura operativa.
                    </p>
                  </div>
                </div>
              </div>

              {/* PUNTO 2 REALIZADO: Contratos suscritos - Se elimina recuadro negro de acuerdo de colaboración y se organizan los otros dos uno a cada lado */}
              <div className="max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8 mt-20">
                <h3 className="text-3xl font-bold text-center text-[#1F2937] mb-10">Contratos Actualmente Suscritos</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 lg:gap-12">
                  <div className="bg-white rounded-3xl p-10 border border-gray-100 shadow-sm hover:shadow-md transition print-avoid-break">
                    <div className="text-[#E01E26] mb-6"><IconBuilding /></div>
                    <h4 className="text-2xl lg:text-3xl font-bold mb-4 text-[#1F2937]">La Red Corredores Davivienda</h4>
                    <p className="text-gray-600 text-lg leading-relaxed">Infraestructura y red de atención dispuesta para la promoción y distribución autorizada de servicios y portafolios de inversión del grupo.</p>
                  </div>
                  <div className="bg-white rounded-3xl p-10 border border-gray-100 shadow-sm hover:shadow-md transition print-avoid-break">
                    <div className="text-[#E01E26] mb-6"><IconUsers /></div>
                    <h4 className="text-2xl lg:text-3xl font-bold mb-4 text-[#1F2937]">La Red Banco Davivienda</h4>
                    <p className="text-gray-600 text-lg leading-relaxed">Red bancaria nacional que actúa como canal de soporte y distribución para masificar y facilitar el acceso a soluciones financieras globales.</p>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 lg:gap-12 mt-20 max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8">
                <div className="bg-white rounded-3xl p-10 border border-gray-100 shadow-sm hover:shadow-md transition print-avoid-break">
                  <div className="text-[#E01E26] mb-6"><IconBuilding /></div>
                  <h3 className="text-2xl lg:text-3xl font-bold mb-4 text-[#1F2937]">La Red</h3>
                  <p className="text-gray-600 text-lg leading-relaxed">Oficinas, canales físicos, cajeros, aplicaciones digitales y personal informático compartido.</p>
                </div>
                <div className="bg-white rounded-3xl p-10 border border-gray-100 shadow-sm hover:shadow-md transition print-avoid-break">
                  <div className="text-[#E01E26] mb-6"><IconUsers /></div>
                  <h3 className="text-2xl lg:text-3xl font-bold mb-4 text-[#1F2937]">Productos Ofrecidos</h3>
                  <ul className="text-gray-600 text-lg space-y-3 list-disc pl-6 marker:text-[#E01E26]">
                    <li>Fondos de Inversión (FICs)</li>
                    <li>Fondos de Pensiones</li>
                    <li>Toma de órdenes de valores</li>
                    <li>Otras listadas en la norma</li> 
                  </ul>
                </div>
                <div className="bg-white rounded-3xl p-10 border border-gray-100 shadow-sm hover:shadow-md transition print-avoid-break">
                  <div className="text-[#E01E26] mb-6"><IconShield /></div>
                  <h3 className="text-2xl lg:text-3xl font-bold mb-4 text-[#1F2937]">Reglas Clave</h3>
                  <ul className="text-gray-600 text-lg space-y-3 list-disc pl-6 marker:text-[#E01E26]">
                    <li>No objeción de la SFC</li>
                    <li>Identificación clara ante el cliente</li>
                    <li>Capacitación obligatoria</li>
                    <li>Listado de entidades autorizadas</li>
                  </ul>
                </div>
                <div className="bg-[#E01E26] rounded-3xl p-10 shadow-lg hover:shadow-xl transition text-white print-avoid-break">
                  <div className="text-white mb-6 opacity-90"><IconTrending /></div>
                  <h3 className="text-2xl lg:text-3xl font-bold mb-4">El Beneficio</h3>
                  <p className="text-red-100 text-lg leading-relaxed">Más acceso a servicios en un solo lugar, transparencia, seguridad y trabajo en equipo inter-entidades.</p>
                </div>
              </div>
            </div>
          </section>
        );

        // --- Sinergia Estratégica ---
        const SinergiaEstrategica = () => {
          return (
            <section id="sinergia-estrategica" className="py-32 bg-white/40 backdrop-blur-sm border-y border-red-50">
              <div className="max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8">
                <div className="mb-20 text-center print-avoid-break">
                  <h2 className="text-4xl md:text-6xl lg:text-7xl font-extrabold text-[#1F2937] mb-6">Sinergia Estratégica</h2>
                  <p className="text-2xl lg:text-3xl text-gray-600 max-w-5xl mx-auto leading-relaxed">Estructura integrada para maximizar la eficiencia y la estandarización operativa.</p>
                </div>

                {/* PUNTO 3 REALIZADO: Se eliminan los cuadros de "Apalancamiento en la Red Bancaria" y "Lineas de Negocio". Se reorganizan los dos restantes uno a cada lado para optimizar espacio */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 lg:gap-12 max-w-5xl mx-auto">
                  <div className="bg-white p-10 lg:p-12 rounded-3xl shadow-sm border border-gray-100 hover:border-red-100 transition-all duration-300 print-avoid-break">
                    <h4 className="text-2xl lg:text-3xl font-bold mb-6 text-[#1F2937]">Optimización de la Operación Interna</h4>
                    <p className="text-gray-600 text-lg lg:text-xl leading-relaxed">Estandarización de procesos clave de soporte y back-office, permitiendo centralizar cargas administrativas esenciales y agilizar la respuesta interna.</p>
                  </div>
                  <div className="bg-white p-10 lg:p-12 rounded-3xl shadow-sm border border-gray-100 hover:border-red-100 transition-all duration-300 print-avoid-break">
                    <h4 className="text-2xl lg:text-3xl font-bold mb-6 text-[#1F2937]">Acuerdos de Nivel de Sinergia (ANS)</h4>
                    <p className="text-gray-600 text-lg lg:text-xl leading-relaxed">Formalización operativa mutua que define límites de responsabilidad, tiempos de servicio y compromisos de calidad entre las entidades.</p>
                  </div>
                </div>
              </div>
            </section>
          );
        };

        // --- Retos de la Transformación ---
        const RetosTransformacion = () => {
          return (
            <section id="retos-transformacion" className="py-32 bg-transparent">
              <div className="max-w-[1600px] w-[95%] mx-auto px-4 sm:px-6 lg:px-8">
                
                {/* PUNTO 4 REALIZADO: Después del título se eliminaron los textos introductorios indicados, el "Reto 1" completo y su sección de Arquitectura y Talento Humano */}
                <div className="mb-20 text-center print-avoid-break">
                  <h2 className="text-4xl md:text-6xl lg:text-7xl font-extrabold text-[#1F2937] mb-6">Retos de la transformación</h2>
                </div>

                <div className="max-w-5xl mx-auto space-y-12">
                  <div className="bg-white p-10 lg:p-12 rounded-3xl shadow-md border border-gray-100 print-avoid-break">
                    <h3 className="text-2xl lg:text-3xl font-bold text-[#1F2937] mb-8 pb-4 border-b border-gray-100">Líneas de Actuación</h3>
                    <div className="space-y-6 text-lg lg:text-xl text-gray-600 leading-relaxed">
                      <p><strong className="text-[#E01E26]">1. Comercial:</strong> Distribución y promoción comercial por parte de la fuerza de ventas.</p>
                      <p><strong className="text-[#E01E26]">2. Operativa / Back Office:</strong> Centralización de actividades operativas de soporte común que generan eficiencias de escala corporativas.</p>
                      <p><strong className="text-[#E01E26]">3. Tecnológica / Canales:</strong> Uso compartido de infraestructura tecnológica, plataformas de comunicación y terminales informáticas.</p>
                      <p><strong className="text-[#E01E26]">4. Sinergia: Vehículos delegados:</strong> Integración y delegación estructurada de funciones de soporte bajo rigurosas pautas regulatorias.</p>
                      
                      {/* PUNTO 5 REALIZADO: Adición del punto 5 conservando exactamente el mismo estilo de color, fuente y texto */}
                      <p><strong className="text-[#E01E26]">5. Unificación de comités de inversiones de FIC’s:</strong> Unificación de comités y estandarización de miembros, como medida de optimización.</p>
                      
                      {/* PUNTO 6 & 7 REALIZADOS: Adición del punto 6 con el texto y título modificado según instrucciones. Se eliminaron los textos de "Reto 2" y sus componentes */}
                      <p><strong className="text-[#E01E26]">6. No delegación de la profesionalidad- Deber fiduciario indelegable:</strong> Garantizar que la toma de decisiones estratégicas, la administración de portafolios y la gestión de riesgos se mantengan exclusivamente en la Fiduciaria.</p>
                    </div>
                  </div>
                </div>

              </div>
            </section>
          );
        };

        // --- Main App Component ---
        const App = () => {
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const toggleMenu = () => setIsMenuOpen(!isMenuOpen);

          return (
            <div className="relative min-h-screen">
              <BackgroundWatermark />
              <Navbar toggleMenu={toggleMenu} isMenuOpen={isMenuOpen} />
              <main>
                <Hero />
                <RelacionVinculados />
                <EconomiasEscala />
                <UsoDeRed />
                <SinergiaEstrategica />
                <RetosTransformacion />
              </main>
              
              <footer className="bg-[#1F2937] text-gray-400 py-12 border-t border-gray-800 print:hidden">
                <div className="max-w-[1600px] w-[95%] mx-auto px-4 text-center text-lg">
                  <p>&copy; 2026 Grupo Bolívar - Davivienda. Todos los derechos reservados.</p>
                </div>
              </footer>
            </div>
          );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
